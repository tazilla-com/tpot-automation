---
# inventories/example/ is DOCUMENTATION. Nothing reads it at run time.
#
# install.sh generates inventories/local/hosts.yml on every run and points
# ansible-playbook at that. This file exists so that the shape is reviewable
# in the repository, and so that `ansible-playbook -i inventories/example ...`
# can be used for --syntax-check without a generated file present.
#
# There is exactly one host, it is always the machine the installer is running
# on, and the connection is always local. This is not a deployment topology
# file and never becomes one: user input lives in an answer file, not here.
# The installer this project replaces put its credentials in an inventory,
# which is how they ended up in a repository.
all:
  hosts:
    tpot:
      ansible_connection: local
