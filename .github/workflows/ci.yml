# SPDX-License-Identifier: Apache-2.0
#
# Everything in this file is a suite that already runs by hand. CI does not
# know anything the tree does not: `tests/run-gates.sh`, `tests/run-bats.sh`,
# `yamllint` and `ansible-lint` are what a contributor runs locally, and the
# job of this workflow is to make a pull request from a stranger hit them
# without anybody remembering to ask.
#
# EVERY ACTION BELOW IS PINNED TO A 40-CHARACTER COMMIT SHA, with its release
# tag kept beside it as a comment. This project's central argument is that a
# mutable ref is not a pin -- it says so about upstream T-Pot at length, and
# pins upstream to a commit for exactly that reason -- and `actions/checkout@v5`
# is a mutable ref by the same argument. A tag is a pointer its owner may move,
# so a workflow written against one runs whatever that pointer names on the day
# it runs, which is not what anybody reviewed. The sha is the pin; the tag in
# the comment is for the human, so a reader can see which release it was and go
# and read that release's notes.
#
# TO MOVE ONE, resolve the new sha rather than editing the comment:
#
#     git ls-remote https://github.com/actions/checkout refs/tags/v5
#
# and mind the annotated-tag trap: for an annotated tag the plain ref names the
# TAG OBJECT and `refs/tags/v5^{}` names the commit, so the obvious reading of
# that output is the wrong 40 characters. Both tags pinned below were
# lightweight when they were resolved, which is why their plain refs are the
# commits here; do not assume it of the next one. A sha that is not a commit in
# that repository fails at checkout with "Unable to resolve action", loudly and
# before any suite runs -- which is a good failure, but a needless one.
#
# THE MAJORS ARE THE POST-NODE-20 ONES. GitHub deprecated the Node 20 runtime
# on its runners; checkout@v4 and setup-python@v5 are Node 20 actions, and v5
# and v6 are their Node 24 successors.
#
# NOTHING HERE INSTALLS T-POT. Every suite below is unprivileged: no root, no
# docker, no target host. The steps DO use the network -- they fetch PyYAML,
# bats, the linters and the collections the play declares -- but only to
# install their own tools; the checks themselves fetch nothing, which is what
# `ansible-lint --offline` is asserting. Whether this installer works on a
# given platform is a runtime property recorded in tests/MATRIX-STATUS.md by a
# dated run on real hardware, and no runner can stand in for that.
---
name: ci

"on":
  push:
    branches: [main]
  pull_request:
  workflow_call:

# A pull request that is force-pushed twice should not queue three full runs.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # tests/check-locale.sh fails the build on plain C anywhere in the tree, and
  # for a reason that applies here too: ansible-core refuses to start under a
  # non-UTF-8 locale, and upstream's installer runs a nested ansible-playbook.
  LANG: C.UTF-8
  LC_ALL: C.UTF-8

jobs:
  gates:
    name: build gates
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09  # v5.1.0

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1  # v6.3.0
        with:
          python-version: "3.13"

      - name: The gates' own dependencies
        # tests/check-matrix-parse.sh reads support-matrix.yml through a real
        # YAML parser as its second opinion on the bash reader, so PyYAML is a
        # dependency of the gate suite and not of the product. It happens to be
        # present on the runner image today; a suite that silently depends on
        # that would report green for a reason nobody chose.
        #
        # Installed into setup-python's interpreter rather than the system one:
        # a modern Ubuntu marks the system Python externally managed (PEP 668)
        # and refuses `pip install` outside a virtualenv. The first version of
        # this step would have died there had PyYAML ever been absent -- a
        # fallback that only works when it is not needed.
        run: python -m pip install --disable-pip-version-check PyYAML

      - name: Run every gate
        # --strict: a SKIPPED gate fails here. run-gates.sh's own header
        # reserves that for a release build, and CI is the closest thing this
        # tree has to one -- a gate that cannot run on the runner must be
        # visible, not quietly counted as a pass.
        run: bash tests/run-gates.sh --strict

      - name: Prove every gate can fail
        # A gate suite that passes proves nothing on its own -- a gate with a
        # broken matcher passes too. --self-test points each gate at a tree
        # that violates it and requires it to fail. This step is the one that
        # makes the step above mean something.
        run: bash tests/run-gates.sh --self-test

  unit:
    name: unit suite
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09  # v5.1.0

      - name: Install bats
        # THE COMMAND THIS TREE ALREADY DOCUMENTS, and the reason it is that
        # one. `npm install -g bats` needs root: on a GitHub runner it tries to
        # write man pages into /usr/local/share/man and dies EACCES, which is
        # exactly what the first run of this workflow did. --prefix $HOME/.local
        # is what tests/run-bats.sh prints when bats is missing, and what the
        # workspace notes tell a developer to run. CI and a contributor should
        # not be installing the same tool two different ways.
        run: |
          set -euo pipefail
          npm install -g --prefix "$HOME/.local" bats
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Run the unit suite
        # run-bats.sh exits 3 when bats is absent rather than exiting 0 with
        # nothing run. Installing it above is what keeps that from being the
        # outcome here; a non-zero exit fails the job either way, which is the
        # point of it exiting 3.
        run: bash tests/run-bats.sh

  lint:
    name: lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09  # v5.1.0

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1  # v6.3.0
        with:
          python-version: "3.13"

      - name: Install the linters
        run: python -m pip install --disable-pip-version-check yamllint ansible-lint

      - name: Install the collections the play declares
        # ansible.cfg points collections_path at /usr/local/share/tpot-automation,
        # which is where the PRODUCT installs them on a honeypot at run time.
        # A linter must not need that path to exist, so the collection goes to
        # ./collections -- which .gitignore ignores and .ansible-lint already
        # excludes -- and ANSIBLE_COLLECTIONS_PATH points at it for the steps
        # that need it.
        run: ansible-galaxy collection install -r requirements.yml -p ./collections

      - name: yamllint
        run: yamllint .

      - name: ansible-lint
        # --offline because .ansible-lint sets offline: true and a rule that
        # silently degrades when a fetch fails is worse than one switched off
        # deliberately. The production profile is stricter than the `moderate`
        # the config requires, and the tree passes it; requiring it here keeps
        # that true.
        env:
          ANSIBLE_COLLECTIONS_PATH: ./collections
        run: ansible-lint --offline --profile production

      - name: Syntax-check both plays
        env:
          ANSIBLE_COLLECTIONS_PATH: ./collections
        run: >-
          ansible-playbook -i inventories/example/hosts.yml
          --syntax-check site.yml verify.yml

  entrypoint:
    name: entrypoint contract
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09  # v5.1.0

      - name: The modes that change nothing all exit 0
        run: |
          set -euo pipefail
          bash install.sh --version
          bash install.sh --help            >/dev/null
          bash install.sh --example-config  >/dev/null

      - name: A refusal still writes a true result.json
        # THE CONTRACT THIS PROTECTS. The exit status is the product, and
        # result.json is the machine-readable half of it. A refusal that
        # writes nothing, or writes an exit_code disagreeing with the process
        # exit, is the failure this asserts against -- and it is not
        # hypothetical: until 2026-09-05 every stage A refusal recorded
        # "preflight": [], because pf_flush had nowhere to write before the
        # run directory existed.
        #
        # This asserts the CONTRACT, not the environment: it does not care
        # which code comes back, only that the artefact agrees with it and
        # that the checks which ran are in there. A runner that happened to be
        # root would still satisfy it.
        #
        # `|| rc=$?` RATHER THAN `rc=$?` ON THE NEXT LINE. GitHub runs every
        # `run:` block as `/usr/bin/bash -e {0}`, so a non-zero exit kills the
        # step where it happens -- and this step's whole subject is a command
        # that exits non-zero on purpose. The first version read the status on
        # the following line and never reached it: the step died at exit 11,
        # which is the very refusal it was written to inspect. `set -uo
        # pipefail` does not undo the -e that Actions supplied; only the `||`
        # makes the failure non-fatal.
        run: |
          set -uo pipefail
          tmp=$(mktemp -d)
          rc=0
          bash install.sh -y --preflight-only \
              --state-dir "$tmp/state" --log-dir "$tmp/log" \
              </dev/null >/dev/null 2>&1 || rc=$?
          echo "install.sh --preflight-only exited $rc"
          python3 - "$tmp/state/result.json" "$rc" <<'PY'
          import json, sys
          doc, rc = sys.argv[1], int(sys.argv[2])
          d = json.load(open(doc))
          assert d["exit_code"] == rc, f'result.json says {d["exit_code"]}, the process exited {rc}'
          assert d["preflight"], "result.json carries no preflight records for a run that ran preflight"
          ids = [r["id"] for r in d["preflight"]]
          print(f'exit_code {d["exit_code"]} agrees; {len(ids)} preflight records: {", ".join(ids)}')
          PY
