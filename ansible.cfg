# SPDX-License-Identifier: Apache-2.0
# ansible.cfg -- the configuration for this project's own play, and nothing else.
#
# ansible-core reads exactly ONE configuration file. It is picked in this
# order: $ANSIBLE_CONFIG, ./ansible.cfg, ~/.ansible.cfg, /etc/ansible/ansible.cfg.
# install.sh therefore exports ANSIBLE_CONFIG pointing at this file rather than
# relying on the current directory, so a run started from anywhere behaves
# identically. Do not add a second .cfg to the tree: the first match wins
# outright and settings are never merged across files.

[defaults]
# Roles are found beside this file. Relative paths are resolved against the
# directory containing ansible.cfg.
roles_path = ./roles

# Collections are installed system-wide, into a path this project owns.
# The user's own ~/.ansible is never touched, and never wiped: the installer
# this project replaces deleted the user's community.* collections and
# reinstalled them unpinned with --force.
# ansible-core accepts `collections_path` (singular) from 2.10 onward;
# `collections_paths` is the older spelling of the same setting.
collections_path = /usr/local/share/tpot-automation/collections

# There is one host and it is local. A retry file would only ever name it.
retry_files_enabled = false

# A handler that has been notified runs even when a later task fails. Without
# this, a failure after `notify: reload sysctl` leaves the box with the file
# written and the setting not applied -- a state that verifies differently
# from what the transcript says was done.
force_handlers = true

# Use the interpreter ansible-core discovers, and do not warn about it. The
# supported distributions ship python3 at different paths, and the warning is
# noise in a transcript that is meant to be read after a failure.
interpreter_python = auto_silent

# install.sh generates this inventory on every run, from the merged
# configuration. inventories/example/ is documentation and is never used.
inventory = inventories/local/hosts.yml

# A skipped task in an hour-long transcript is noise; a changed one is not.
display_skipped_hosts = false

# Deprecation warnings are wanted: they are the early signal that a supported
# distribution's ansible-core has moved under us.
deprecation_warnings = true

# install.sh sets ANSIBLE_LOG_PATH to a sibling of its own transcript, so both
# land in the same 0750 directory. It is deliberately NOT set here: the path
# carries the run timestamp, and a fixed path would append every run of every
# version into one file.

[privilege_escalation]
# The play runs as root already. Individual tasks become the unprivileged
# T-Pot account explicitly, which is the only escalation in the tree.
become = false
become_method = sudo

[ssh_connection]
# Present for completeness only. The single host is `ansible_connection: local`
# and no SSH connection is opened by this project.
pipelining = true
